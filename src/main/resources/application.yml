spring:
  datasource:
    url: jdbc:h2:file:./h2/db-migration;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/h2
    enabled: true
    validate-migration-naming: true
  h2:
    console:
      enabled: true
