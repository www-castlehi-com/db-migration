spring:
  datasource:
    url: jdbc:h2:file:./h2/liquibase;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/liquibase/db.changelog-master.yaml
  h2:
    console:
      enabled: true